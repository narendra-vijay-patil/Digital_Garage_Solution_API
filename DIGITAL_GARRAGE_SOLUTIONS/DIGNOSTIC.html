<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
<a class="navbar-brand fw-bold" href="index.html">E-Garage</a>
</div>
</nav>

<section class="bg-dark text-white text-center py-5 mt-5" style="background-color:  rgb(245, 224, 197);">
<h1 class="fw-bold">Vehicle Diagnostics</h1>
<p class="lead">Advanced computer diagnostics</p>
    <a href="index.html#services" class="btn btn-warning mt-3" id="backBtn">← Back to Home</a>
</section>

<section class="py-5">
<div class="container">
<div class="row g-4">

<div class="col-md-4">
<div class="card shadow h-100">
<div class="card-body">
<h5>Engine Scan</h5>
<p>Error code detection</p>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow h-100">
<div class="card-body">
<h5>Electrical Check</h5>
<p>Battery, wiring, ECU</p>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow h-100">

<p>Mileage & engine health</p>
</div>
</div>
</div>

</div>

<!-- ================= DIAGNOSTICS BOOKING FORM ================= -->
<section id="book-diagnostic" class="py-5 bg-light" style="background-color: rgb(245, 224, 197);" >
  <div class="container" style="background-color: rgb(193, 230, 230);" >
    <h2 class="fw-bold text-center mb-5">Book Vehicle Diagnostics</h2>

    <div class="row justify-content-center">
      <div class="col-lg-6" style="background-color: rgb(193, 230, 230);">
        <div class="card shadow-lg p-4 border-0" style="background-color: rgb(193, 230, 230);">
          <h5 class="fw-bold mb-4 text-center text-secondary">
            Vehicle Diagnostics Booking
          </h5>

          <form id="diagnosticForm">

            <!-- Name -->
            <div class="form-floating mb-3">
              <input type="text" id="d_name" class="form-control" placeholder="Full Name" required>
              <label for="d_name">Full Name</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" id="d_email" class="form-control" placeholder="a@gmail.com" required>
              <label for="d_name">Email</label>
            </div>

            <!-- Contact -->
            <div class="form-floating mb-3">
              <input type="tel" id="d_contact" class="form-control" placeholder="Contact Number" required>
              <label for="d_contact">Contact Number</label>
            </div>

            <!-- Vehicle Type -->
            <div class="form-floating mb-3">
              <select id="d_vehicle" class="form-select" required>
                <option value="">Select Vehicle Type</option>
                <option>Car</option>
                <option>Bike</option>
                <option>SUV</option>
                <option>Truck</option>
              </select>
              <label for="d_vehicle">Vehicle Type</label>
            </div>

            <!-- Issue -->
            <div class="form-floating mb-3">
              <select id="d_issue" class="form-select" required>
                <option value="">Select Issue / Symptom</option>
                <option>Engine Warning Light</option>
                <option>Battery Problem</option>
                <option>Low Mileage</option>
                <option>Brake Issue</option>
                <option>Electrical Fault</option>
              </select>
              <label for="d_issue">Vehicle Issue</label>
            </div>

            <!-- Diagnostic Type -->
            <div class="form-floating mb-3">
              <select id="d_type" class="form-select" required>
                <option value="">Select Diagnostic Type</option>
                <option>Basic Inspection</option>
                <option>Computer Scan</option>
                <option>Advanced Diagnostics</option>
              </select>
              <label for="d_type">Diagnostic Type</label>
            </div>

            <!-- Date -->
            <div class="form-floating mb-3">
              <input type="date" id="d_date" class="form-control" required>
              <label for="d_date">Preferred Date</label>
            </div>

            <!-- Garage -->
            <div class="form-floating mb-3">
              <select id="d_garage" class="form-select" required>
                <option value="">Select Garage</option>
                <option>Downtown Garage</option>
                <option>City Motors</option>
                <option>Premium Auto Care</option>
              </select>
              <label for="d_garage">Select Garage</label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold" onclick="bookDiagnostics()">
              Book Diagnostics
            </button>

            <!-- Message -->
            <p id="diagnosticMessage" class="mt-3 text-center fw-bold"></p>

          </form>
        </div>
      </div>
    </div>
  </div>
</section>
</section>

<!-- ================= SCRIPT ================= -->
<script>
  const diagForm = document.getElementById('diagnosticForm');
  const diagMsg = document.getElementById('diagnosticMessage');

  diagForm.addEventListener('submit', function(e){
    e.preventDefault();

    const name = d_name.value;
    const vehicle = d_vehicle.value;
    const issue = d_issue.value;
    const type = d_type.value;
    const date = d_date.value;
    const garage = d_garage.value;

    if(name && vehicle && issue && type && date && garage){
      const estimatedTime = Math.floor(Math.random() * 60) + 30; // 30–90 mins

      diagMsg.innerHTML = `
        Thank you <strong>${name}</strong>!<br>
        Your <strong>${type}</strong> for <strong>${vehicle}</strong> is booked.<br>
        Issue: <strong>${issue}</strong><br>
        Garage: <strong>${garage}</strong><br>
        Estimated diagnostic time: <strong>${estimatedTime} minutes</strong>.
      `;
      diagMsg.classList.add('text-success');
      diagForm.reset();
    } else {
      diagMsg.innerText = "Please fill all fields.";
      diagMsg.classList.add('text-danger');
    }
  });
  async function bookDiagnostics() {
    const data = {
        Name: document.getElementById("d_name").value,
        Contact: document.getElementById("d_contact").value,
        Email: document.getElementById("d_email").value,
        Garage: document.getElementById("d_garage").value,
        IssueType: document.getElementById("d_type").value
    };

    try {
        const response = await fetch("http://localhost:5032/api/diagnostics/bookdignostics", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        if (!response.ok) throw new Error("Booking failed");
        const result = await response.text();
        alert(result);

        document.getElementById("diagnosticsForm").reset(); // reset form
    } catch (err) {
        console.error("Diagnostics booking error:", err);
        alert("Booking failed. Please try again.");
    }
}

</script>

</body>
</html>
