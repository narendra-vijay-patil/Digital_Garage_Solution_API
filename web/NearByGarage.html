<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Garages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; }
    .card:hover { transform: scale(1.02); transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer;}
    #map { width: 100%; height: 500px; border-radius: 10px; }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4 text-center">Nearby Trusted Garages</h2>
  <div class="row">
    <!-- Left: Garage List -->
    <div class="col-md-5">
      <div id="garageList"></div>
    </div>
    <!-- Right: Map -->
    <div class="col-md-7">
      <div id="map"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Replace YOUR_REAL_API_KEY with your actual Google Maps API key -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_REAL_API_KEY&libraries=marker&callback=initMap" async defer></script>

<script>
let map;
let markers = [];
let garages = []; // Will fetch from API

async function fetchGarages() {
  try {
    // Fetch garages from .NET Core Web API
    const response = await fetch('https://localhost:7230/api/garages'); // Replace with your API URL
    garages = await response.json();
    renderGarageList();
  } catch (err) {
    console.error('Failed to fetch garages:', err);
  }
}

function renderGarageList() {
  const listDiv = document.getElementById('garageList');
  listDiv.innerHTML = '';
  garages.forEach((garage, index) => {
    const card = document.createElement('div');
    card.className = 'card mb-3';
    card.innerHTML = `
      <div class="card-body">
        <h5 class="card-title">${garage.name}</h5>
        <p class="card-text">${garage.distance} km away | ⭐ ${garage.rating} | Services: ${garage.services}</p>
        <button class="btn btn-primary btn-sm">Book Now</button>
      </div>`;
    card.addEventListener('click', () => focusGarage(index));
    listDiv.appendChild(card);
  });
}

function initMap() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      const userLoc = {lat: position.coords.latitude, lng: position.coords.longitude};
      map = new google.maps.Map(document.getElementById('map'), {center: userLoc, zoom: 14});

      // User marker
      new google.maps.marker.AdvancedMarkerElement({
        position: userLoc,
        map: map,
        title: "You are here",
        content: `<div style="padding:5px 10px; background:blue; color:white; border-radius:50%;">You</div>`
      });

      // Fetch garage data after map is ready
      fetchGarages().then(() => addGarageMarkers());
    });
  } else {
    alert("Geolocation is not supported by this browser.");
  }
}

function addGarageMarkers() {
  garages.forEach((garage, index) => {
    const marker = new google.maps.marker.AdvancedMarkerElement({
      position: {lat: garage.lat, lng: garage.lng},
      map: map,
      title: garage.name,
      content: `<div style="padding:5px 10px; background:#0D6EFD; color:white; border-radius:5px;">${garage.name}</div>`
    });
    markers.push(marker);
    marker.addListener('click', () => {
      map.setZoom(16);
      map.setCenter(marker.position);
      document.querySelectorAll('.card')[index].scrollIntoView({behavior: 'smooth'});
    });
  });
}

function focusGarage(index) {
  map.setZoom(16);
  map.setCenter(markers[index].position);
}
</script>
</body>
</html>
